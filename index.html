<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sh7nkart</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1a1c20;--mu:#6b7280;--bd:#e3e5ea;--ac:#2563eb;--ok:#16a34a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111317;--card:#1b1e24;--tx:#eef0f4;--mu:#9aa1ad;--bd:#2c313a;--ac:#5b8cff;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding:16px;max-width:480px;margin-inline:auto}
h1{font-size:22px;margin:8px 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px}
.lbl{font-size:13px;color:var(--mu);margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.op{border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:14px 8px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit}
.op.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--card))}
.btn{display:block;width:100%;text-align:center;text-decoration:none;border:0;border-radius:12px;padding:15px;font-size:17px;font-weight:700;background:var(--ac);color:#fff;cursor:pointer;font-family:inherit}
.btn.g{background:var(--ok)}
.btn.off{opacity:.4;pointer-events:none}
.btn.s{background:transparent;color:var(--ac);border:2px solid var(--ac)}
.sr{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
#prev{width:100%;max-height:200px;object-fit:contain;border-radius:10px;margin-top:12px;display:none}
input[type=text]{width:100%;font-size:24px;letter-spacing:2px;text-align:center;padding:14px;border-radius:12px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);direction:ltr;font-family:ui-monospace,monospace}
#st{font-size:14px;color:var(--mu);margin-top:10px;min-height:20px;text-align:center}
.code{direction:ltr;text-align:center;font-family:ui-monospace,monospace;color:var(--mu);font-size:14px;margin:10px 0}
</style>
</head>
<body>
<h1>📲 Sh7nkart</h1>

<div class="card">
  <div class="lbl">١. اختار الشبكة</div>
  <div class="grid" id="ops"></div>
</div>

<div class="card">
  <div class="lbl">٢. صوّر الكارت</div>
  <input type="file" id="f" accept="image/*" capture="environment" class="sr">
  <input type="file" id="g" accept="image/*" class="sr">
  <label class="btn s" for="f">📷 تصوير الكارت</label>
  <label class="btn s" for="g" style="margin-top:10px">🖼️ اختيار صورة من المعرض</label>
  <img id="prev" alt="">
  <div id="st"></div>
</div>

<div class="card">
  <div class="lbl">٣. راجع الرقم واتصل</div>
  <input type="text" id="num" inputmode="numeric" placeholder="رقم الكارت" autocomplete="off">
  <div class="code" id="code"></div>
  <a class="btn g off" id="call" href="#" target="_top">📞 اتصال وشحن</a>
  <button class="btn s" id="cp" style="margin-top:10px">📋 نسخ الكود (للصقه في الاتصال)</button>
  <div id="cpst" style="font-size:13px;color:var(--mu);text-align:center;margin-top:8px;min-height:18px"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
